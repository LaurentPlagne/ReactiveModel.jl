name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Resolve and test a standalone source copy
        run: julia --startup-file=no ci/check.jl test

  docs:
    name: Executable documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Resolve and execute the manual and check local links
        run: julia --startup-file=no ci/check.jl docs
      - name: Upload the verified manual
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy-docs:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the manual
        id: deployment
        uses: actions/deploy-pages@v4
