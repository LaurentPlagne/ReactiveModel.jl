<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 415">
<title id="title">Minimum-cost network flow</title><desc id="desc">At the first time step North supplies 10 units, Centre consumes 3 and South consumes 7. Ten units travel from North to Centre and seven from Centre to South. No flow uses the direct arc.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:18px}.small{font-size:15px}.head{font-size:21px;font-weight:600}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1000" height="415" rx="12" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" class="head">Network flow at t = 1</text><path class="edge" d="M220 200 L450 140"/><text x="310" y="115" text-anchor="middle" class="small">Flow 10; capacity 10</text><text x="310" y="139" text-anchor="middle" class="small">Cost 2/unit</text><path class="edge" d="M550 140 L780 200"/><text x="690" y="115" text-anchor="middle" class="small">Flow 7; capacity 8</text><text x="690" y="139" text-anchor="middle" class="small">Cost 1/unit</text><path class="edge" d="M165 281 L165 335 L835 335 L835 281"/><text x="500" y="320" text-anchor="middle" class="small">Direct arc: flow 0; capacity 4; cost 4/unit</text><circle cx="165" cy="220" r="61" fill="#f0f5fb" stroke="#94a3b8"/><text x="165" y="215" text-anchor="middle" class="head">North</text><text x="165" y="243" text-anchor="middle" class="small">Injection +10</text><circle cx="500" cy="125" r="61" fill="#f0f5fb" stroke="#94a3b8"/><text x="500" y="120" text-anchor="middle" class="head">Centre</text><text x="500" y="148" text-anchor="middle" class="small">Injection −3</text><circle cx="835" cy="220" r="61" fill="#f0f5fb" stroke="#94a3b8"/><text x="835" y="215" text-anchor="middle" class="head">South</text><text x="835" y="243" text-anchor="middle" class="small">Injection −7</text><text x="500" y="390" text-anchor="middle" class="">Conservation: outgoing − incoming = injection. Total cost: 10 × 2 + 7 × 1 = 27.</text></svg>