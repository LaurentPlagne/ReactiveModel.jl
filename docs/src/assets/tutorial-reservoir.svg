<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 425">
<title id="title">Reservoir stage balance</title><desc id="desc">Incoming stock and inflow are split between outgoing stock, turbine release and spill. At the horizon the remaining stock enters supplied terminal-value cuts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:18px}.small{font-size:15px}.head{font-size:21px;font-weight:600}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1000" height="425" rx="12" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" class="head">A reservoir transition at period t</text><rect x="340" y="105" width="280" height="130" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="480.0" y="135" text-anchor="middle" class="head">Reservoir</text><text x="480.0" y="165" text-anchor="middle" class="">0 ≤ sₜ ≤ capacity</text><text x="480.0" y="190" text-anchor="middle" class="">Water balance</text><path class="edge" d="M35 170 L340 170"/><text x="180" y="145" text-anchor="middle" class="">Incoming stock sₜ₋₁</text><path class="edge" d="M480 63 L480 105"/><text x="480" y="56" text-anchor="middle" class="">Inflow Δₜ aωₜ</text><path class="edge" d="M620 140 L760 140"/><rect x="765" y="90" width="210" height="90" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="870.0" y="120" text-anchor="middle" class="head">Turbine</text><text x="870.0" y="150" text-anchor="middle" class="">Revenue Δₜ πωₜ ηₜ uₜ</text><path class="edge" d="M620 208 L760 233"/><text x="825" y="235" text-anchor="middle" class="">Spill Δₜ zₜ</text><path class="edge" d="M480 235 L480 305"/><text x="345" y="278" text-anchor="middle" class="">Outgoing stock sₜ</text><rect x="245" y="310" width="485" height="68" rx="9" fill="#f6f4fb" stroke="#94a3b8"/><text x="487.5" y="340" text-anchor="middle" class="head">Next period, or terminal value</text><text x="500" y="400" text-anchor="middle" class="small">sₜ − sₜ₋₁ + Δₜ(uₜ + zₜ) = Δₜ aωₜ. At T: α ≤ βₖ sT + γₖ for every cut k.</text></svg>