<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 365">
<title id="title">Dispatch model</title><desc id="desc">Two bounded generators supply a changing demand. Generator 1 costs 40 per MWh and has capacity 80 MW. Generator 2 costs 70 and has capacity 60. Demand rises from 100 to 110 MW.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:18px}.small{font-size:15px}.head{font-size:21px;font-weight:600}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1000" height="365" rx="12" fill="#ffffff"/>
<text x="500" y="32" text-anchor="middle" class="head">Two-generator dispatch: one-hour periods</text><rect x="35" y="65" width="280" height="100" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="175.0" y="95" text-anchor="middle" class="head">Generator 1</text><text x="175.0" y="125" text-anchor="middle" class="">Capacity 80 MW; cost 40/MWh</text><rect x="35" y="205" width="280" height="100" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="175.0" y="235" text-anchor="middle" class="head">Generator 2</text><text x="175.0" y="265" text-anchor="middle" class="">Capacity 60 MW; cost 70/MWh</text><rect x="410" y="130" width="180" height="100" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="500.0" y="160" text-anchor="middle" class="head">Balance</text><text x="500.0" y="190" text-anchor="middle" class="">p₁ + p₂ = Dₜ</text><rect x="710" y="100" width="255" height="155" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="837.5" y="130" text-anchor="middle" class="head">Demand</text><text x="837.5" y="160" text-anchor="middle" class="">t = 1: 100 MW</text><text x="837.5" y="185" text-anchor="middle" class="">t = 2: 110 MW</text><path class="edge" d="M315 115 L375 115 L410 160"/><text x="375" y="100" text-anchor="middle" class="small">p₁</text><path class="edge" d="M315 255 L375 255 L410 200"/><text x="370" y="280" text-anchor="middle" class="small">p₂</text><path class="edge" d="M590 180 L710 180"/><text x="650" y="155" text-anchor="middle" class="small">Supply</text><text x="500" y="340" text-anchor="middle" class="">Solution: (80, 20) MW, then (80, 30) MW; costs 4600, then 5300.</text></svg>