<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 600">
<title id="title">Definition, study data and numerical state</title><desc id="desc">ConstData holds a fixed mathematical definition and study payload by reference. Keep the payload read-only between rebuilds. A changing parameter point is an isbits value with one fixed concrete type. The definition, payload and point feed a private numerical workspace and persistent solver backend owned by one LinearProblem. After changing study data, rebuild every sharing problem before solving. Changed families or keys require a new definition and problem.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:22px}.small{font-size:18px}.head{font-size:24px;font-weight:650}.edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.muted{fill:#475569}.mono{font-family:ui-monospace,monospace;font-size:20px}</style>
