<text x="490" y="258" text-anchor="start" class="small">Read for formulas</text>
<rect x="30" y="330" width="245" height="135" rx="10" fill="#f5f3ff" stroke="#94a3b8"/><text x="152.5" y="364" text-anchor="middle" class="head">Parameter point</text><text x="152.5" y="397" text-anchor="middle" class="">Values may change</text><text x="152.5" y="426" text-anchor="middle" class="">Same concrete type</text><text x="152.5" y="455" text-anchor="middle" class="">isbits value</text>
