<rect x="450" y="80" width="395" height="120" rx="10" fill="#ecfdf5" stroke="#94a3b8"/><text x="647.5" y="114" text-anchor="middle" class="head">Study payload</text><text x="647.5" y="147" text-anchor="middle" class="">Arrays, dicts, structs</text><text x="647.5" y="176" text-anchor="middle" class="">Read-only between rebuilds</text>
