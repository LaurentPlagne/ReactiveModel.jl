<path class="edge" d="M605 397H655"/>
<rect x="655" y="330" width="210" height="135" rx="10" fill="#ecfdf5" stroke="#94a3b8"/><text x="760.0" y="364" text-anchor="middle" class="head">Backend</text><text x="760.0" y="397" text-anchor="middle" class="">Persistent</text><text x="760.0" y="426" text-anchor="middle" class="">solver model</text>
