<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 585">
<title id="title">Live solution and retained snapshots</title><desc id="desc">The executed example minimizes x with zero to ten bounds. At rhs=2 the live solution, saved scalar and materialized variable snapshot have value two. At rhs=4 the same live solution reports four; the retained scalar and snapshot stay two. At rhs=20 the solve is infeasible, so live queries raise while the retained values stay two. Recovery at rhs=3 refreshes the same solution object to three; retained values are still two.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:22px}.small{font-size:18px}.head{font-size:24px;font-weight:650}.edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.muted{fill:#475569}.mono{font-family:ui-monospace,monospace;font-size:20px}</style>
<rect width="900" height="585" rx="14" fill="#ffffff"/>
<text x="450" y="36" text-anchor="middle" class="head">One live solution, retained snapshots</text><rect x="40" y="70" width="190" height="85" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="135.0" y="104" text-anchor="middle" class="head">solve(rhs=2)</text><text x="135.0" y="137" text-anchor="middle" class="">optimal</text><rect x="250" y="70" width="190" height="85" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="345.0" y="104" text-anchor="middle" class="head">solve(rhs=4)</text><text x="345.0" y="137" text-anchor="middle" class="">optimal</text><rect x="460" y="70" width="190" height="85" rx="10" fill="#fff1f2" stroke="#94a3b8"/><text x="555.0" y="104" text-anchor="middle" class="head">solve(rhs=20)</text><text x="555.0" y="137" text-anchor="middle" class="">SolveError</text><rect x="670" y="70" width="190" height="85" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="765.0" y="104" text-anchor="middle" class="head">solve(rhs=3)</text><text x="765.0" y="137" text-anchor="middle" class="">optimal</text><text x="40" y="191" text-anchor="start" class="head">Live Solution · the same object</text><rect x="40" y="210" width="190" height="95" rx="10" fill="#ecfdf5" stroke="#94a3b8"/><text x="135.0" y="244" text-anchor="middle" class="head">2.0</text><text x="135.0" y="277" text-anchor="middle" class="">first result</text><rect x="250" y="210" width="190" height="95" rx="10" fill="#ecfdf5" stroke="#94a3b8"/><text x="345.0" y="244" text-anchor="middle" class="head">4.0</text><text x="345.0" y="277" text-anchor="middle" class="">refreshed</text><rect x="460" y="210" width="190" height="95" rx="10" fill="#fff1f2" stroke="#94a3b8"/><text x="555.0" y="244" text-anchor="middle" class="head">invalid</text><text x="555.0" y="277" text-anchor="middle" class="">queries raise</text><rect x="670" y="210" width="190" height="95" rx="10" fill="#ecfdf5" stroke="#94a3b8"/><text x="765.0" y="244" text-anchor="middle" class="head">3.0</text><text x="765.0" y="277" text-anchor="middle" class="">refreshed</text><path class="edge" d="M230 257H250"/><path class="edge" d="M440 257H460"/><path class="edge" d="M650 257H670"/><text x="40" y="350" text-anchor="start" class="head">Values retained from the first solve</text><rect x="40" y="375" width="190" height="95" rx="10" fill="#f5f3ff" stroke="#94a3b8"/><text x="135.0" y="409" text-anchor="middle" class="head">2.0</text><text x="135.0" y="442" text-anchor="middle" class="">scalar + snapshot</text><rect x="250" y="375" width="190" height="95" rx="10" fill="#f5f3ff" stroke="#94a3b8"/><text x="345.0" y="409" text-anchor="middle" class="head">2.0</text><text x="345.0" y="442" text-anchor="middle" class="">scalar + snapshot</text><rect x="460" y="375" width="190" height="95" rx="10" fill="#f5f3ff" stroke="#94a3b8"/><text x="555.0" y="409" text-anchor="middle" class="head">2.0</text><text x="555.0" y="442" text-anchor="middle" class="">scalar + snapshot</text><rect x="670" y="375" width="190" height="95" rx="10" fill="#f5f3ff" stroke="#94a3b8"/><text x="765.0" y="409" text-anchor="middle" class="head">2.0</text><text x="765.0" y="442" text-anchor="middle" class="">scalar + snapshot</text><text x="450" y="519" text-anchor="middle" class="">saved_value and saved_variables keep 2.0.</text><text x="450" y="554" text-anchor="middle" class="">After recovery, recovered === solution.</text>
</svg>