<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 850">
<title id="title">First construction and subsequent safe or selective solves</title><desc id="desc">Initial construction assembles numerical values and initializes the backend; the first solve optimizes. Rebuilding repeats construction before the next solve. Later safe-mode calls reevaluate every numerical formula, even at an identical point. Selective mode reuses the previous outcome at an identical point; at a distinct point, dependency conditions choose which formulas to reevaluate. Both update paths compare numerical values with isequal and send only actual native differences through backend setters. Objective-constant changes are retained even without a native coefficient setter. A changed numerical model is optimized; an unchanged model reuses its previous outcome. Reusing a nonoptimal outcome raises SolveError again. Retaining the backend model does not guarantee basis reuse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:22px}.small{font-size:18px}.head{font-size:24px;font-weight:650}.edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.muted{fill:#475569}.mono{font-family:ui-monospace,monospace;font-size:20px}</style>
<rect width="900" height="850" rx="14" fill="#ffffff"/>
<text x="450" y="36" text-anchor="middle" class="head">From parameter point to solver outcome</text><text x="40" y="75" text-anchor="start" class="small muted">FIRST OUTCOME · construction and solve</text><rect x="40" y="95" width="250" height="100" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="165.0" y="129" text-anchor="middle" class="head">Build numerical model</text><text x="165.0" y="162" text-anchor="middle" class="">Assemble all values</text><rect x="330" y="95" width="270" height="100" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="465.0" y="129" text-anchor="middle" class="head">Initialize backend</text><text x="465.0" y="162" text-anchor="middle" class="">Retain the model</text><rect x="640" y="95" width="220" height="100" rx="10" fill="#eaf5ed" stroke="#94a3b8"/><text x="750.0" y="129" text-anchor="middle" class="head">Optimize</text><text x="750.0" y="162" text-anchor="middle" class="">Record outcome</text><path class="edge" d="M290 145H330"/><path class="edge" d="M600 145H640"/><path d="M40 223H860" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="255" text-anchor="start" class="small muted">LATER CALLS · same concrete point type</text><rect x="40" y="280" width="370" height="118" rx="10" fill="#fff4e6" stroke="#94a3b8"/><text x="225.0" y="314" text-anchor="middle" class="head">Safe mode</text><text x="225.0" y="347" text-anchor="middle" class="">Reevaluate all numerical formulas</text><text x="225.0" y="376" text-anchor="middle" class="">even at an identical point</text><rect x="490" y="280" width="370" height="118" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="675.0" y="314" text-anchor="middle" class="head">Selective mode</text><text x="675.0" y="347" text-anchor="middle" class="">Identical point: reuse outcome</text><text x="675.0" y="376" text-anchor="middle" class="">Distinct point: test conditions</text><rect x="490" y="430" width="370" height="85" rx="10" fill="#f0f5fb" stroke="#94a3b8"/><text x="675.0" y="464" text-anchor="middle" class="head">Evaluate affected formulas</text><text x="675.0" y="497" text-anchor="middle" class="">Conditions choose reevaluation</text><path class="edge" d="M225 398V550"/><path class="edge" d="M675 398V430"/><path class="edge" d="M675 515V550"/><rect x="40" y="550" width="820" height="118" rx="10" fill="#f0f0fb" stroke="#94a3b8"/><text x="450.0" y="584" text-anchor="middle" class="head">Compare numerical values with isequal</text><text x="450.0" y="617" text-anchor="middle" class="">Send only actual differences through backend setters</text><text x="450.0" y="646" text-anchor="middle" class="">Retain objective-constant changes in public results</text><path class="edge" d="M450 668V688H225V710"/><path class="edge" d="M450 688H675V710"/><rect x="40" y="710" width="370" height="85" rx="10" fill="#eaf5ed" stroke="#94a3b8"/><text x="225.0" y="744" text-anchor="middle" class="head">Optimize</text><text x="225.0" y="777" text-anchor="middle" class="">Numerical values changed</text><rect x="490" y="710" width="370" height="85" rx="10" fill="#eaf5ed" stroke="#94a3b8"/><text x="675.0" y="744" text-anchor="middle" class="head">Reuse outcome</text><text x="675.0" y="777" text-anchor="middle" class="">Numerical values unchanged</text><path class="edge" d="M860 347H882V752H860"/><text x="450" y="829" text-anchor="middle" class="small muted">A reused nonoptimal outcome raises SolveError again.</text>
</svg>