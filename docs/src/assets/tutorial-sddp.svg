<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 380">
<title id="title">Forward and backward SDDP passes</title><desc id="desc">Three stage LPs pass stock forward along a sampled inflow path. The backward pass enumerates the two inflows at each visited state, averages values and balance duals, then updates future-cost cuts in the preceding stage.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b4d;font-size:18px}.small{font-size:15px}.head{font-size:21px;font-weight:600}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1000" height="380" rx="12" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" class="head">SDDP: sample states, then improve future-cost cuts</text><rect x="40" y="90" width="250" height="105" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="165.0" y="120" text-anchor="middle" class="head">Stage 1</text><text x="165.0" y="150" text-anchor="middle" class="">Solve LP at observed inflow</text><text x="165.0" y="175" text-anchor="middle" class="">Pass outgoing stock forward</text><rect x="375" y="90" width="250" height="105" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="500.0" y="120" text-anchor="middle" class="head">Stage 2</text><text x="500.0" y="150" text-anchor="middle" class="">Solve LP at observed inflow</text><text x="500.0" y="175" text-anchor="middle" class="">Pass outgoing stock forward</text><rect x="710" y="90" width="250" height="105" rx="9" fill="#f0f5fb" stroke="#94a3b8"/><text x="835.0" y="120" text-anchor="middle" class="head">Stage 3</text><text x="835.0" y="150" text-anchor="middle" class="">Solve LP at observed inflow</text><text x="835.0" y="175" text-anchor="middle" class="">No cost after stage 3</text><path class="edge" d="M290 140 L375 140"/><path class="edge" d="M625 140 L710 140"/><text x="500" y="66" text-anchor="middle" class="small">Forward: sample one inflow path; no knowledge of future outcomes.</text><path class="edge" d="M840 195 L840 280 L625 280"/><path class="edge" d="M625 280 L290 280"/><path class="edge" d="M290 280 L165 280 L165 195"/><text x="500" y="265" text-anchor="middle" class="small">Backward: enumerate both inflows, average values and duals.</text><text x="500" y="320" text-anchor="middle" class="small">Insert cuts in the preceding LP, rebuild after cut-data mutation, repeat.</text><text x="500" y="355" text-anchor="middle" class="small">Check: lower bound ≤ exact scenario-tree optimum ≤ expected feasible-policy cost.</text></svg>